name: CI Pipeline with Code Quality

on:
  push:
    branches: [ main, feature/code-quality-ci ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run code quality checks (flake8)
        run: |
          flake8 .

      - name: Run unit tests
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t devops-web-app .
